# Reports custom KiCad components (project-library or locally edited symbols, footprints and
# 3D models) using https://github.com/Alacrity-Education/ConstructFeeder
name: ConstructFeeder

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  construct-feeder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # all branches, needed for all-branches

      - name: Collect custom components
        id: feeder
        uses: Alacrity-Education/ConstructFeeder@v1
        with:
          root: .
          all-branches: "true"
          worktree: "true"
          fail-on-custom: "false"

      - run: echo "Custom components found = ${{ steps.feeder.outputs.custom-count }}"

      - uses: actions/upload-artifact@v4
        with:
          name: construct-feeder
          path: ${{ steps.feeder.outputs.zip }}
